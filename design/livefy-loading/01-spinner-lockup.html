<!doctype html>
<html lang="en" data-motion="auto" data-width="1000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Livefy — silent loading · 01 Spinner in the brand lockup</title>
<style>
  /* Tokens: verbatim subset of apps/desktop/src/styles.css (light = :root).
     Full 53/52 token set: design/system.md. */
  :root {
    --background: oklch(1.0000 0 0);
    --foreground: oklch(0.2850 0 0);
    --card: oklch(1.0000 0 0);
    --card-foreground: oklch(0.2850 0 0);
    --primary: oklch(0.9347 0.1825 120.5229);
    --primary-foreground: oklch(0 0 0);
    --muted: oklch(0.9845 0.0026 106.4477);
    --muted-foreground: oklch(0.5103 0 0);
    --border: oklch(0.9269 0.0160 110.5685);
    --ring: oklch(0.9347 0.1825 120.5229);
    --radius: 1rem;
    --spacing: 0.25rem;
    --letter-spacing: 0em;
    --shadow-lg: 0px 8px 20px 0px hsl(0 0% 0% / 0.12), 0px 4px 6px -1px hsl(0 0% 0% / 0.12);
  }
  .dark {
    --background: oklch(0.2679 0.0036 106.6427);
    --foreground: oklch(0.9576 0.0027 106.4494);
    --card: oklch(0.2928 0.0018 106.5092);
    --card-foreground: oklch(0.9818 0.0054 95.0986);
    --primary: oklch(0.9347 0.1825 120.5229);
    --primary-foreground: oklch(0.1913 0 0);
    --muted: oklch(0.2213 0.0038 106.7070);
    --muted-foreground: oklch(0.7713 0.0169 99.0657);
    --border: oklch(0.3618 0.0101 106.8928);
    --ring: oklch(0.9347 0.1825 120.5229);
    --shadow-lg: 0px 10px 28px 0px hsl(0 0% 0% / 0.24), 0px 4px 6px -1px hsl(0 0% 0% / 0.24);
  }

  html {
    font-family: 'Geist Variable', ui-sans-serif, sans-serif, system-ui;
    letter-spacing: var(--letter-spacing);
    background: var(--background);
  }
  body { margin: 0; min-width: 20rem; color: var(--foreground); background: var(--background); }
  * { box-sizing: border-box; }

  /* Shared shell, from apps/desktop/src/styles.css */
  .visual-shell {
    display: flex;
    min-height: 100svh;
    align-items: center;
    justify-content: center;
    padding: var(--shell-pad, clamp(1rem, 4vw, 3rem));
    background: var(--muted);
  }
  html[data-width="320"] .visual-shell {
    width: 320px;
    margin-inline: auto;
    /* At a 320px viewport clamp(1rem, 4vw, 3rem) resolves to its 1rem lower bound. */
    --shell-pad: 1rem;
    box-shadow: 0 0 0 1px var(--border);
  }

  /* Card primitive (base-nova), composed as the shared shell does */
  .card {
    --card-spacing: 1rem;
    display: flex;
    flex-direction: column;
    gap: var(--card-spacing);
    width: 100%;
    max-width: 30rem;
    padding-block: var(--card-spacing);
    border-radius: calc(var(--radius) * 1.4);
    background: var(--card);
    color: var(--card-foreground);
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent);
    overflow: hidden;
    overflow-wrap: anywhere;
    font-size: 0.875rem;
  }
  .card-header { display: flex; flex-direction: row; align-items: center; gap: 0.875rem; padding-inline: var(--card-spacing); }
  .card-header h1 { margin: 0; font-size: 1rem; line-height: 1.375; font-weight: 500; }
  .card-body { display: flex; flex-direction: column; gap: 1.25rem; padding-inline: var(--card-spacing); min-height: 3.5rem; }

  /* Brand mark: 2.75rem square, radius calc(var(--radius) * 0.6), lime fill, black L */
  .visual-mark {
    display: grid;
    place-items: center;
    width: 2.75rem;
    height: 2.75rem;
    flex-shrink: 0;
    border-radius: calc(var(--radius) * 0.6);
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 1.25rem;
    font-weight: 700;
    line-height: 1;
  }

  /* Direction 01 — the official Spinner, right-aligned inside the header row.
     The artboard reproduces the registry primitive's static appearance and its own
     built-in rotation (Tailwind animate-spin) so the motion can be judged here.
     Production renders <Spinner /> from the `spinner` registry item; no bespoke CSS.
     Colour: the primitive inherits currentColor (--card-foreground, 14.35:1 light /
     12.36:1 dark), so it needs no colour class. */
  .spinner {
    margin-left: auto;
    width: 1.25rem;
    height: 1.25rem;
    flex-shrink: 0;
    color: currentColor;
    animation: spin 1000ms linear infinite;
  }
  .spinner path { stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Reduced motion: the primitive's rotation is dropped, the glyph stays visible.
     Stricter than the product decision in apps/desktop/README.md rule 7. */
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="on"]) .spinner { animation: none !important; }
  }
  html[data-motion="reduce"] .spinner { animation: none !important; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* Artboard preview chrome — not part of the product. */
  .rail {
    position: fixed;
    left: 50%;
    bottom: 1rem;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    padding: 0.375rem 0.5rem;
    border-radius: var(--radius);
    background: var(--card);
    color: var(--card-foreground);
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--foreground) 14%, transparent), var(--shadow-lg);
    font-size: 0.75rem;
    z-index: 10;
  }
  .rail-label { padding-inline: 0.375rem; color: var(--muted-foreground); font-size: 0.6875rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .rail-group { display: inline-flex; gap: 0.125rem; padding: 0.125rem; border-radius: calc(var(--radius) * 0.6); background: var(--muted); }
  .rail button {
    height: 1.75rem;
    padding-inline: 0.5rem;
    border: 0;
    border-radius: calc(var(--radius) * 0.6);
    background: transparent;
    color: var(--foreground);
    font: inherit;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .rail button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); font-weight: 500; }
  .rail button:hover:not([aria-pressed="true"]) { background: color-mix(in oklab, var(--foreground) 8%, transparent); }
  .rail button:focus-visible { outline: 2px solid var(--foreground); outline-offset: 2px; }
</style>
</head>
<body>
<main class="visual-shell">
  <section class="card" aria-labelledby="shell-title">
    <header class="card-header">
      <span class="visual-mark" aria-hidden="true">L</span>
      <h1 id="shell-title">Livefy</h1>
      <!-- Production: <Spinner className="ml-auto" /> — registry item `spinner`.
           Emulated here as its rendered glyph plus its own animate-spin. -->
      <svg class="spinner" viewBox="0 0 24 24" role="status" aria-label="Loading" focusable="false">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
      </svg>
    </header>
    <div class="card-body">
      <!-- The shell's own announcement; no visible status text in the wait. -->
      <p class="sr-only" role="status">Loading</p>
    </div>
  </section>
</main>

<div class="rail" role="group" aria-label="Artboard preview controls (not part of the app)">
  <span class="rail-label">Preview only</span>
  <div class="rail-group" role="group" aria-label="Theme">
    <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
    <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
  </div>
  <div class="rail-group" role="group" aria-label="Width sample">
    <button type="button" data-width-set="1000" aria-pressed="true">1000px</button>
    <button type="button" data-width-set="320" aria-pressed="false">320px</button>
  </div>
  <div class="rail-group" role="group" aria-label="Motion">
    <button type="button" data-motion-set="auto" aria-pressed="true">Animated</button>
    <button type="button" data-motion-set="reduce" aria-pressed="false">Reduced</button>
  </div>
</div>

<script>
  (function () {
    var root = document.documentElement;
    function press(attr, value) {
      var buttons = document.querySelectorAll('[' + attr + ']');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute(attr) === value));
      }
    }
    document.addEventListener('click', function (event) {
      var button = event.target.closest('button[data-theme-set], button[data-width-set], button[data-motion-set]');
      if (!button) return;
      if (button.hasAttribute('data-theme-set')) {
        var theme = button.getAttribute('data-theme-set');
        root.classList.toggle('dark', theme === 'dark');
        press('data-theme-set', theme);
      } else if (button.hasAttribute('data-width-set')) {
        var width = button.getAttribute('data-width-set');
        root.setAttribute('data-width', width);
        press('data-width-set', width);
      } else {
        var motion = button.getAttribute('data-motion-set');
        root.setAttribute('data-motion', motion);
        press('data-motion-set', motion);
      }
    });
  })();
</script>
</body>
</html>
